services:
  indexer:
    # The image digest and the contract address are written here literally, not read from the env file:
    # dstack measures the compose file into RTMR3, so pinning RTMR3 then pins exactly this image and
    # this contract. Change either, redeploy, and re-pin.
    image: ghcr.io/moyedx3/blindfold-indexer@sha256:3ce11be29d4f89e66bb1aa8db1c7f71d46c2cdff0665886eac9949df645d4a2f
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NETWORK: "preprod"
      CONTRACT_ADDRESS: "84d80ed010cea433e242379f3e82927477b09d0268fcfcc36e69753279546a8f"
      DATA_DIR: "/data"
      PORT: "8080"
      POLL_MS: "5000"
      DSTACK_ENDPOINT: "/var/run/dstack.sock"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - indexer-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  indexer-data: {}
