name: release-image

# Builds the TEE indexer image for linux/amd64 (Phala CVMs run on Intel TDX hosts)
# and pushes it to GHCR. The printed digest is the value to pin in deploy/cvm/.env
# and deploy/networks.json. Trigger manually (Actions → release-image → Run workflow)
# or by pushing a tag like v0.1.0.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (the digest is what gets pinned; the tag is a label)"
        required: false
        default: "0.1.0"
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/blindfold-indexer

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Compact 0.31.1
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update 0.31.1
          test "$("$HOME/.local/bin/compact" compile --version)" = "0.31.1"
      - run: npm ci
      - run: npm run check:runtime-copies
      - run: npm run compile -w contract
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: indexer/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record the digest
        run: |
          {
            echo "## Indexer image"
            echo
            echo '```'
            echo "IMAGE=${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
            echo "tag:    ${IMAGE_NAME}:${{ steps.tag.outputs.value }}"
            echo "commit: ${{ github.sha }}"
            echo '```'
            echo
            echo "Pin the IMAGE line in deploy/cvm/.env and record the digest in deploy/networks.json after attestation is verified."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "IMAGE=${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
