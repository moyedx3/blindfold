name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Compact 0.31.1
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update 0.31.1
          test "$("$HOME/.local/bin/compact" compile --version)" = "0.31.1"
      - run: npm ci
      - run: npm run check:runtime-copies
      - run: npm run compile -w contract
      - run: npm test
      - run: npm run build -w indexer -w packages/midnight-web -w buyer -w creator
      - run: npx tsc -p deploy/tsconfig.json
      - run: npm run qa:secrets
      - run: docker compose -f deploy/devnet/docker-compose.yml config >/dev/null
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w buyer
      - run: npm run test:e2e -w creator
